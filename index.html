<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio API</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
  <div id="app">
    <div class="div-form d-flex flex-column justify-content-center align-items-center">
      <div id="form" class="form d-flex flex-column align-items-center justify-content-center mt-3">
        <div class="title-h1 d-flex flex-row">
          <h1 class="text-gradient me-4">Rick and Morty</h1>
          <span class="h1 ft-sec">cards</span>
        </div>

        <div class="div-input">
          <div class="right-input  d-flex flex-column p-3 col-6 aling-center">

            <h2>Nome</h2>
            <input class="input-name" type="text" v-model="name" placeholder="Filtrar pelo nome">

            <h2 class="mt-3">Status</h2>
            <select class="select" v-model="status">
                <option value="">Todos</option>
                <option value="alive">Vivo</option>
                <option value="dead">Morto</option>
                <option value="unknown">Desconhecido</option>
            </select>

          </div>
          <div class="left-input d-flex flex-column p-3 col-6 justify-content-start">

            <h2>Gênero</h2>
            <select class="select" v-model="gender">
                <option value="">Todos</option>
                <option value="male">Homem</option>
                <option value="female">Mulher</option>
                <option value="genderless">Sem Gênero</option>
                <option value="unknown">Desconhecido</option>
            </select>

            <h2 class="mt-3">Espécie</h2>
            <select class="select" v-model="species">
              <option value="">Todos</option>
              <option value="Human">Humano</option>
              <option value="Alien">Alienígena</option>
            </select>
          </div>
        </div>
        <button class="animation-button" v-on:click="search">
          <i class="arr-2 fa-solid fa-magnifying-glass"></i>
          <span class="text">B U S C A R</span>
          <span class="circle"></span>
          <i class="arr-1 fa-solid fa-magnifying-glass"></i>
        </button>
      </div>


    </div>

    <div class="list-character">
      <ul class="ul-character">
        <li v-for="personagem in personagens" class="li-card d-flex">
          <div class="card">
            <div class="character-image">
              <img class="character-image-perfil" :src="personagem.image" alt="">
            </div>
            <div class="info-dates">
              <p class="p-card m-0 p-0">{{personagem.name}}</p>
              <p class="p-card m-0 p-0">{{personagem.status}}</p>
              <p class="p-card m-0 p-0">{{personagem.gender}}</p>
              <p class="p-card m-0 p-0">{{personagem.species}}</p>
            </div>
          </div>
        </li>
    </ul>
    </div>

  </div>

  <script src="./app.js"></script>
</body>
</html>
